name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
      - name: Compile the server
        run: go build .

      - uses: oven-sh/setup-bun@v2
      - name: Build the bundle
        run: |
          bun install
          bun run build

      - uses: biomejs/setup-biome@v2
      - name: Lint and format checks for html, css and js files
        run: |
          biome check public/index.html
          biome check public/playground.js
          biome check public/style.css
