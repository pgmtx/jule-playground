<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="icon" href="./static/icon.svg">
        <link rel="stylesheet" href="./style.css">
        <title>Jule Playground</title>
    </head>
    <body>
        <div id="top">
            <h1>Jule Playground</h1>
            <p>Wanna learn more about Jule? Check out the <a href="https://pgmtx.neocities.org/articles/jule_cheatsheet">cheatsheet</a> and the <a href="https://manual.jule.dev/">manual</a>.</p>
            <select id="examples">
                <option value="hello-world">Hello world</option>
                <option value="fizzbuzz">Fizzbuzz</option>
                <option value="randomness">Randomness</option>
                <option value="comptime-matching">Comptime matching</option>
            </select>
            <div id="build-arguments-wrapper">
                <label for="build-arguments">Build arguments:</label>
                <input type="text" name="build-arguments" id="build-arguments">
            </div>
            <noscript>
                <p>JavaScript is disabled in your browser. Please enable JavaScript to use the code editor.</p>
            </noscript>
            <div id="editors">
                <div id="editor"></div>
                <div id="ir-editor"></div>
            </div>
        </div>
        <div id="output-wrapper">
            <script type="module" src="./bundle.js"></script>
            <div id="buttons">
                <button type="button" id="run-button">Run (Ctrl-Enter)</button>
                <button type="button" id="format-button">Format (Shift-Enter)</button>
            </div>
            <pre id="output">
clang version 21.1.2
jule0.2.0</pre>
        </div>
    </body>
</html>
